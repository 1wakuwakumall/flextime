<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>フレックスタイム管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom print styles for monthly submission */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; font-size: 12pt; }
            .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; shadow: none !important; }
            table { width: 100%; border-collapse: collapse; margin-top: 15px; }
            th, td { border: 1px solid #000 !important; padding: 6px 10px !important; text-align: left; }
            th { background-color: #f2f2f2 !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

    <!-- Header -->
    <header class="no-print bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 leading-none">フレックス管理</h1>
                    <span class="text-xs text-slate-500 font-medium">標準 7時間 / 日</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Settings Cog Button -->
                <button onclick="openSettingsModal()" class="p-2.5 rounded-xl text-slate-600 hover:bg-slate-100 active:bg-slate-200 transition-colors" title="設定・バックアップ" aria-label="設定">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Quick Record Input Panel -->
        <section class="no-print bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
            <h2 class="text-sm font-semibold text-slate-500 tracking-wider uppercase mb-3 flex items-center gap-1.5">
                <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                超過・不足時間の記録
            </h2>

            <form id="recordForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <!-- Date & Note Inputs -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">日付</label>
                        <input type="date" id="inputDate" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 font-medium text-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">メモ (任意)</label>
                        <input type="text" id="inputNote" placeholder="例: プロジェクト残業, 早退" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-800">
                    </div>
                </div>

                <!-- Quick Increment Buttons (30m steps - NO 0m) -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1.5">ワンタップ調整（30分単位）</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <button type="button" onclick="quickAdd(60)" class="py-2.5 px-3 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 active:scale-95 border border-emerald-200 font-semibold text-sm transition-all text-center">
                            +1時間 (+60分)
                        </button>
                        <button type="button" onclick="quickAdd(30)" class="py-2.5 px-3 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 active:scale-95 border border-emerald-200 font-semibold text-sm transition-all text-center">
                            +30分
                        </button>
                        <button type="button" onclick="quickAdd(-30)" class="py-2.5 px-3 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100 active:scale-95 border border-rose-200 font-semibold text-sm transition-all text-center">
                            -30分
                        </button>
                        <button type="button" onclick="quickAdd(-60)" class="py-2.5 px-3 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100 active:scale-95 border border-rose-200 font-semibold text-sm transition-all text-center">
                            -1時間 (-60分)
                        </button>
                    </div>
                </div>

                <!-- Custom Duration Picker (30m increments) -->
                <div class="pt-2 border-t border-slate-100 flex flex-wrap sm:flex-nowrap items-center gap-3">
                    <div class="flex-1 flex items-center space-x-2">
                        <select id="inputSign" class="py-2.5 px-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 font-bold text-slate-700">
                            <option value="1">超過 (+)</option>
                            <option value="-1">不足 (-)</option>
                        </select>
                        <select id="inputMinutes" class="flex-1 py-2.5 px-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 font-medium text-slate-800">
                            <option value="30">30分</option>
                            <option value="60">1時間 (60分)</option>
                            <option value="90">1時間30分 (90分)</option>
                            <option value="120">2時間 (120分)</option>
                            <option value="150">2時間30分 (150分)</option>
                            <option value="180">3時間 (180分)</option>
                            <option value="210">3時間30分 (210分)</option>
                            <option value="240">4時間 (240分)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full sm:w-auto py-2.5 px-6 rounded-xl bg-slate-900 text-white font-semibold hover:bg-slate-800 active:scale-95 transition-all shadow-md shadow-slate-900/10">
                        追加登録
                    </button>
                </div>
            </form>
        </section>

        <!-- Monthly Summary Dashboard & Filters -->
        <section class="no-print bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div class="flex items-center space-x-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase">表示月:</label>
                    <input type="month" id="monthPicker" onchange="renderApp()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold text-slate-800 focus:outline-none focus:border-brand-500">
                </div>

                <div class="flex items-center space-x-2">
                    <!-- Export CSV Button -->
                    <button onclick="exportCSV()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        CSV出力
                    </button>
                    <!-- Print / PDF Button -->
                    <button onclick="triggerPrint()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-50 text-brand-700 hover:bg-brand-100 text-xs font-semibold transition-colors border border-brand-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        PDF / 印刷
                    </button>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100 text-center">
                    <span class="block text-xs font-medium text-slate-500">当月差引累計</span>
                    <span id="statNetTotal" class="text-lg sm:text-2xl font-black text-slate-900 mt-0.5 block">0分</span>
                </div>
                <div class="bg-emerald-50/60 p-3.5 rounded-xl border border-emerald-100 text-center">
                    <span class="block text-xs font-medium text-emerald-600">当月超過 (+)</span>
                    <span id="statExcess" class="text-lg sm:text-2xl font-bold text-emerald-700 mt-0.5 block">+0分</span>
                </div>
                <div class="bg-rose-50/60 p-3.5 rounded-xl border border-rose-100 text-center">
                    <span class="block text-xs font-medium text-rose-600">当月不足 (-)</span>
                    <span id="statShortage" class="text-lg sm:text-2xl font-bold text-rose-700 mt-0.5 block">-0分</span>
                </div>
            </div>
        </section>

        <!-- Records History List -->
        <section class="no-print bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-slate-800 text-sm">記録一覧</h3>
                <span id="recordCount" class="text-xs text-slate-400 font-medium">0件の記録</span>
            </div>

            <div id="recordsList" class="divide-y divide-slate-100">
                <!-- Records injected via JavaScript -->
            </div>

            <div id="emptyState" class="p-8 text-center hidden">
                <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <p class="text-sm font-medium text-slate-500">この月のデータはありません</p>
            </div>
        </section>

        <!-- Print / PDF Submission View (Only active on print window) -->
        <div class="print-only print-container">
            <div style="text-align: center; margin-bottom: 20px;">
                <h1 style="font-size: 18pt; font-weight: bold; margin-bottom: 5px;">フレックスタイム勤務時間 調整申請書</h1>
                <p style="font-size: 10pt;">対象年月: <span id="printMonthLabel" style="font-weight: bold;"></span></p>
            </div>

            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 10pt;">
                <div>基本標準時間: 1日 7時間</div>
                <div>出力日: <span id="printTodayDate"></span></div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 20%;">日付</th>
                        <th style="width: 15%;">区分</th>
                        <th style="width: 25%;">調整時間</th>
                        <th>備考・理由</th>
                    </tr>
                </thead>
                <tbody id="printTableBody">
                    <!-- Injected for print -->
                </tbody>
            </table>

            <div style="margin-top: 20px; border-top: 2px solid #000; padding-top: 10px; display: flex; justify-content: space-between; font-weight: bold;">
                <div>月間差引合計: <span id="printNetTotal"></span></div>
                <div>( 超過計: <span id="printExcess"></span> / 不足計: <span id="printShortage"></span> )</div>
            </div>
        </div>

    </main>

    <!-- Settings & Backup Modal -->
    <div id="settingsModal" class="no-print fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-5 animate-in fade-in zoom-in duration-150">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-lg text-slate-900 flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    データ管理・バックアップ
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Backup Section -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase">1. データのバックアップ</label>
                <p class="text-xs text-slate-500">現在の全データを暗号コードとして出力します。機種変更時などにコピーして保存してください。</p>
                <button onclick="copyBackupCode()" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 rounded-xl font-semibold text-xs flex items-center justify-center gap-2 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    バックアップコードをコピー
                </button>
            </div>

            <hr class="border-slate-100">

            <!-- Restore Section -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase">2. データの復元</label>
                <p class="text-xs text-slate-500">保存しておいたバックアップコードを下に貼り付けて「復元」を押してください。</p>
                <textarea id="restoreInput" rows="3" placeholder="バックアップコードをここに貼り付け" class="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 font-mono text-slate-700"></textarea>
                <button onclick="restoreData()" class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white rounded-xl font-semibold text-xs transition-colors shadow-sm">
                    データを復元する
                </button>
            </div>

            <div class="pt-2 text-right">
                <button onclick="closeSettingsModal()" class="px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-800">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="no-print fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-xl transition-all duration-200 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">通知メッセージ</span>
    </div>

    <script>
        const STORAGE_KEY = 'flextime_records_v1';
        let records = [];

        // Application Initialization
        window.addEventListener('DOMContentLoaded', () => {
            // Set default date inputs
            const today = new Date();
            document.getElementById('inputDate').value = formatDateIso(today);
            document.getElementById('monthPicker').value = formatDateMonth(today);

            // Load records
            loadRecords();
            renderApp();
        });

        // Load data from localStorage
        function loadRecords() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                records = stored ? JSON.parse(stored) : [];
            } catch (e) {
                records = [];
                console.error("Failed to load records", e);
            }
        }

        // Save data to localStorage
        function saveRecords() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            } catch (e) {
                showToast("保存に失敗しました");
            }
        }

        // Form Submit Handler
        function handleFormSubmit(e) {
            e.preventDefault();
            const date = document.getElementById('inputDate').value;
            const note = document.getElementById('inputNote').value.trim();
            const sign = parseInt(document.getElementById('inputSign').value, 10);
            const minutesVal = parseInt(document.getElementById('inputMinutes').value, 10);

            if (!date || isNaN(minutesVal) || minutesVal <= 0) return;

            const totalMinutes = sign * minutesVal;
            addRecord(date, totalMinutes, note);

            // Reset inputs
            document.getElementById('inputNote').value = '';
        }

        // Quick Increment Add Handler (+1h, +30m, -30m, -1h)
        function quickAdd(mins) {
            const date = document.getElementById('inputDate').value;
            const note = document.getElementById('inputNote').value.trim();

            if (!date) {
                showToast("日付を選択してください");
                return;
            }

            addRecord(date, mins, note);
            document.getElementById('inputNote').value = '';
        }

        // Add Record Logic
        function addRecord(date, minutes, note) {
            const record = {
                id: Date.now().toString(),
                date: date,
                minutes: minutes,
                note: note,
                createdAt: new Date().toISOString()
            };

            records.push(record);
            // Sort records descending by date
            records.sort((a, b) => b.date.localeCompare(a.date));

            saveRecords();
            
            // Auto switch month filter to added date's month
            if (date.substring(0, 7) !== document.getElementById('monthPicker').value) {
                document.getElementById('monthPicker').value = date.substring(0, 7);
            }

            renderApp();
            showToast("記録を追加しました");
        }

        // Delete Record Logic
        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveRecords();
            renderApp();
            showToast("削除しました");
        }

        // Main Render Function
        function renderApp() {
            const selectedMonth = document.getElementById('monthPicker').value;
            const filtered = records.filter(r => r.date.startsWith(selectedMonth));

            const listEl = document.getElementById('recordsList');
            const emptyEl = document.getElementById('emptyState');
            listEl.innerHTML = '';

            let totalExcess = 0;
            let totalShortage = 0;

            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
            } else {
                emptyEl.classList.add('hidden');

                filtered.forEach(record => {
                    if (record.minutes > 0) totalExcess += record.minutes;
                    if (record.minutes < 0) totalShortage += Math.abs(record.minutes);

                    const isExcess = record.minutes > 0;
                    const badgeBg = isExcess ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200';
                    const signStr = isExcess ? '+' : '-';

                    const item = document.createElement('div');
                    item.className = 'p-4 flex items-center justify-between hover:bg-slate-50/80 transition-colors';
                    item.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="px-2.5 py-1 rounded-lg border text-xs font-bold ${badgeBg}">
                                ${signStr}${formatMinutes(Math.abs(record.minutes))}
                            </div>
                            <div>
                                <div class="text-xs font-bold text-slate-800">${formatJapaneseDate(record.date)}</div>
                                ${record.note ? `<div class="text-xs text-slate-500 mt-0.5">${escapeHtml(record.note)}</div>` : ''}
                            </div>
                        </div>
                        <button onclick="deleteRecord('${record.id}')" class="p-2 text-slate-400 hover:text-rose-600 transition-colors" title="削除">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                    listEl.appendChild(item);
                });
            }

            // Calculate Monthly Net
            const netMinutes = totalExcess - totalShortage;
            
            // Update Dashboard Stats
            document.getElementById('statNetTotal').innerText = (netMinutes >= 0 ? '+' : '-') + formatMinutes(Math.abs(netMinutes));
            document.getElementById('statNetTotal').className = `text-lg sm:text-2xl font-black mt-0.5 block ${netMinutes >= 0 ? 'text-emerald-700' : 'text-rose-700'}`;
            document.getElementById('statExcess').innerText = '+' + formatMinutes(totalExcess);
            document.getElementById('statShortage').innerText = '-' + formatMinutes(totalShortage);
            document.getElementById('recordCount').innerText = `${filtered.length}件の記録`;

            // Prepare Print View
            renderPrintView(filtered, selectedMonth, netMinutes, totalExcess, totalShortage);
        }

        // Render Print Table
        function renderPrintView(filtered, monthStr, netMins, excessMins, shortageMins) {
            document.getElementById('printMonthLabel').innerText = monthStr.replace('-', '年 ') + '月';
            document.getElementById('printTodayDate').innerText = new Date().toLocaleDateString('ja-JP');
            
            const tbody = document.getElementById('printTableBody');
            tbody.innerHTML = '';

            filtered.forEach(r => {
                const tr = document.createElement('tr');
                const isExcess = r.minutes > 0;
                tr.innerHTML = `
                    <td>${r.date}</td>
                    <td>${isExcess ? '超過' : '不足'}</td>
                    <td>${isExcess ? '+' : '-'}${formatMinutes(Math.abs(r.minutes))}</td>
                    <td>${escapeHtml(r.note || '-')}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('printNetTotal').innerText = (netMins >= 0 ? '+' : '-') + formatMinutes(Math.abs(netMins));
            document.getElementById('printExcess').innerText = '+' + formatMinutes(excessMins);
            document.getElementById('printShortage').innerText = '-' + formatMinutes(shortageMins);
        }

        // CSV Export Function (UTF-8 with BOM for Excel compatibility)
        function exportCSV() {
            const selectedMonth = document.getElementById('monthPicker').value;
            const filtered = records.filter(r => r.date.startsWith(selectedMonth));

            if (filtered.length === 0) {
                showToast("出力するデータがありません");
                return;
            }

            let csvContent = "\uFEFF日付,区分,調整時間(分),調整時間(表記),備考\n";
            filtered.forEach(r => {
                const type = r.minutes > 0 ? "超過" : "不足";
                const formatted = (r.minutes > 0 ? "+" : "-") + formatMinutes(Math.abs(r.minutes));
                const note = (r.note || "").replace(/"/g, '""');
                csvContent += `"${r.date}","${type}","${r.minutes}","${formatted}","${note}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `flextime_report_${selectedMonth}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Trigger Print Window
        function triggerPrint() {
            window.print();
        }

        // Backup and Restore Modals Logic
        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        // Copy Backup Code
        function copyBackupCode() {
            if (records.length === 0) {
                showToast("保存されているデータがありません");
                return;
            }
            try {
                const code = btoa(encodeURIComponent(JSON.stringify(records)));
                
                // Fallback copy implementation
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = code;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextArea);

                showToast("バックアップコードをコピーしました！");
            } catch (e) {
                showToast("コードの生成に失敗しました");
            }
        }

        // Restore Data Logic
        function restoreData() {
            const input = document.getElementById('restoreInput').value.trim();
            if (!input) {
                showToast("コードを貼り付けてください");
                return;
            }

            try {
                const decodedJson = decodeURIComponent(atob(input));
                const parsedRecords = JSON.parse(decodedJson);

                if (Array.isArray(parsedRecords)) {
                    records = parsedRecords;
                    saveRecords();
                    renderApp();
                    closeSettingsModal();
                    document.getElementById('restoreInput').value = '';
                    showToast("データを正常に復元しました！");
                } else {
                    throw new Error("Invalid format");
                }
            } catch (e) {
                showToast("無効なバックアップコードです");
            }
        }

        // Utility Helper Functions
        function formatMinutes(mins) {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            if (h === 0) return `${m}分`;
            if (m === 0) return `${h}時間`;
            return `${h}時間${m}分`;
        }

        function formatDateIso(d) {
            return d.toISOString().split('T')[0];
        }

        function formatDateMonth(d) {
            return d.toISOString().substring(0, 7);
        }

        function formatJapaneseDate(dateStr) {
            const parts = dateStr.split('-');
            if (parts.length < 3) return dateStr;
            return `${parts[0]}年${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日`;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
