<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>フレックスタイム超過・不足管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Custom CSS for Printable PDF Layout -->
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; font-size: 11pt; }
            .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; }
            table { width: 100%; border-collapse: collapse; margin-top: 15px; }
            th, td { border: 1px solid #333 !important; padding: 8px 10px !important; text-align: left; }
            th { background-color: #f3f4f6 !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

    <!-- Application Header -->
    <header class="no-print bg-slate-900 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-500 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-none text-white">フレックス時間管理</h1>
                    <span class="text-[10px] text-slate-400 font-medium">超過・不足の差分累計アプリ</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Settings Button -->
                <button onclick="openSettingsModal()" class="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800 active:bg-slate-700 transition-colors" title="設定・データ管理" aria-label="設定">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-xl w-full mx-auto px-3 sm:px-4 py-4 space-y-4">

        <!-- Monthly Navigation & Work Filter Bar -->
        <section class="no-print bg-white rounded-2xl p-3 shadow-sm border border-slate-200/80 flex flex-wrap items-center justify-between gap-2.5">
            <!-- Month Selector -->
            <div class="flex items-center space-x-1.5">
                <button onclick="changeMonth(-1)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 transition-colors" title="前月">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <input type="month" id="monthPicker" onchange="renderApp()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                <button onclick="changeMonth(1)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 transition-colors" title="次月">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- Job/Work Category Filter -->
            <div class="flex items-center space-x-1.5 flex-1 justify-end min-w-[150px]">
                <label class="text-xs font-semibold text-slate-500 whitespace-nowrap">業務:</label>
                <select id="jobCategoryFilter" onchange="renderApp()" class="w-full sm:w-auto px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                    <option value="ALL">すべての業務 (全累計)</option>
                    <!-- Options populated by JS -->
                </select>
            </div>
        </section>

        <!-- TOP DASHBOARD: Hero Highlight Summary Card (Net Cumulative Time Only) -->
        <section class="no-print">
            <div id="heroCard" class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-5 shadow-lg border border-slate-700/50 relative overflow-hidden transition-all duration-300">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 rounded-full bg-white/5 blur-2xl pointer-events-none"></div>
                
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                        <span id="heroPulseDot" class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                        当月 差引累計時間 (超過・不足)
                    </span>
                    <span id="heroMonthLabel" class="text-xs bg-slate-800/80 border border-slate-700 text-slate-300 px-2.5 py-0.5 rounded-full font-medium">--</span>
                </div>
                
                <!-- Main Value Display -->
                <div class="mt-4 mb-2 flex items-baseline justify-between flex-wrap gap-2">
                    <div id="heroNetValue" class="text-4xl sm:text-5xl font-black tracking-tight text-brand-400">
                        +0分
                    </div>
                    <div id="heroBadge" class="text-xs font-bold px-3 py-1 rounded-full bg-brand-500/20 text-brand-300 border border-brand-500/30">
                        プラマイゼロ
                    </div>
                </div>

                <!-- Sub Breakdown (Excess vs Shortage Totals) -->
                <div class="mt-4 pt-3 border-t border-slate-700/60 flex items-center justify-between text-xs text-slate-400">
                    <div class="flex items-center gap-1.5">
                        <span>当月超過合計:</span>
                        <span id="statExcessOnly" class="font-bold text-emerald-400">+0分</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span>当月不足合計:</span>
                        <span id="statShortageOnly" class="font-bold text-rose-400">-0分</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Daily Record Input Panel -->
        <section class="no-print bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
                <h2 class="text-sm font-bold text-slate-900 flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    日次超過・不足の登録
                </h2>
                <span class="text-[11px] text-slate-400 font-medium">30分単位での入力</span>
            </div>

            <form id="recordForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <!-- Date & Work Category Inputs -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">日付</label>
                        <input type="date" id="inputDate" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 font-medium text-slate-900 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">業務種別</label>
                        <select id="inputJobCategory" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 font-medium text-slate-900 text-sm">
                            <!-- Populated via JS -->
                        </select>
                    </div>
                </div>

                <!-- Quick Buttons (Positive and Negative 30m steps - NO 0m option) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">ワンタップクイック登録</label>
                    <!-- Overtime (+) Quick Buttons -->
                    <div class="grid grid-cols-4 gap-1.5 mb-1.5">
                        <button type="button" onclick="quickAdd(30)" class="py-2 px-1 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 active:scale-95 border border-emerald-200/80 font-bold text-xs transition-all text-center">
                            +30分
                        </button>
                        <button type="button" onclick="quickAdd(60)" class="py-2 px-1 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 active:scale-95 border border-emerald-200/80 font-bold text-xs transition-all text-center">
                            +1時間
                        </button>
                        <button type="button" onclick="quickAdd(90)" class="py-2 px-1 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 active:scale-95 border border-emerald-200/80 font-bold text-xs transition-all text-center">
                            +1.5時間
                        </button>
                        <button type="button" onclick="quickAdd(120)" class="py-2 px-1 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 active:scale-95 border border-emerald-200/80 font-bold text-xs transition-all text-center">
                            +2時間
                        </button>
                    </div>
                    <!-- Shortage (-) Quick Buttons -->
                    <div class="grid grid-cols-4 gap-1.5">
                        <button type="button" onclick="quickAdd(-30)" class="py-2 px-1 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100 active:scale-95 border border-rose-200/80 font-bold text-xs transition-all text-center">
                            -30分
                        </button>
                        <button type="button" onclick="quickAdd(-60)" class="py-2 px-1 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100 active:scale-95 border border-rose-200/80 font-bold text-xs transition-all text-center">
                            -1時間
                        </button>
                        <button type="button" onclick="quickAdd(-90)" class="py-2 px-1 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100 active:scale-95 border border-rose-200/80 font-bold text-xs transition-all text-center">
                            -1.5時間
                        </button>
                        <button type="button" onclick="quickAdd(-120)" class="py-2 px-1 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100 active:scale-95 border border-rose-200/80 font-bold text-xs transition-all text-center">
                            -2時間
                        </button>
                    </div>
                </div>

                <!-- Custom Duration Form Dropdowns (NO 0m) -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-100">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">区分</label>
                        <select id="inputSign" class="w-full py-2 px-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 font-bold text-slate-800 text-xs">
                            <option value="1">超過 (+)</option>
                            <option value="-1">不足 (-)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">時間指定</label>
                        <select id="inputMinutes" class="w-full py-2 px-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 font-medium text-slate-900 text-xs">
                            <option value="30">30分</option>
                            <option value="60">1時間 (60分)</option>
                            <option value="90">1時間30分 (90分)</option>
                            <option value="120">2時間 (120分)</option>
                            <option value="150">2時間30分 (150分)</option>
                            <option value="180">3時間 (180分)</option>
                            <option value="210">3時間30分 (210分)</option>
                            <option value="240">4時間 (240分)</option>
                            <option value="300">5時間 (300分)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">備考 / メモ</label>
                        <input type="text" id="inputNote" placeholder="例: 早退, 残業, 調整" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 text-slate-900 text-xs">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 px-6 rounded-xl bg-slate-900 text-white font-bold text-xs hover:bg-slate-800 active:scale-[0.98] transition-all shadow-md shadow-slate-900/10">
                    手動入力で記録を追加
                </button>
            </form>
        </section>

        <!-- Monthly Records List Section -->
        <section class="no-print bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2">
                <div>
                    <h3 class="font-bold text-slate-900 text-sm">記録一覧</h3>
                    <span id="recordCountLabel" class="text-xs text-slate-400">0件の記録</span>
                </div>

                <!-- Export Action Buttons -->
                <div class="flex items-center space-x-2">
                    <button onclick="exportCSV()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 text-xs font-bold transition-colors">
                        <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        CSV
                    </button>
                    <button onclick="triggerPrint()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-brand-50 text-brand-700 hover:bg-brand-100 active:bg-brand-200 text-xs font-bold transition-colors border border-brand-200">
                        <svg class="w-3.5 h-3.5 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        PDF / 印刷
                    </button>
                </div>
            </div>

            <!-- List container -->
            <div id="recordsList" class="divide-y divide-slate-100">
                <!-- Dynamically filled via JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="p-8 text-center hidden">
                <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <p class="text-xs font-medium text-slate-500">選択月の記録はありません</p>
            </div>
        </section>

        <!-- Print / PDF Submission View (Only active on print preview) -->
        <div class="print-only print-container">
            <div style="text-align: center; margin-bottom: 20px;">
                <h1 style="font-size: 18pt; font-weight: bold; margin-bottom: 5px;">フレックスタイム超過・不足時間 報告書</h1>
                <p style="font-size: 11pt; color: #444;">対象年月: <span id="printMonthLabel" style="font-weight: bold; color: #000;"></span></p>
            </div>

            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 10pt;">
                <div>対象業務: <span id="printJobFilterLabel">すべて</span></div>
                <div>発行日: <span id="printTodayDate"></span></div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 20%;">日付</th>
                        <th style="width: 25%;">業務種別</th>
                        <th style="width: 15%;">区分</th>
                        <th style="width: 20%;">調整時間</th>
                        <th>備考・事由</th>
                    </tr>
                </thead>
                <tbody id="printTableBody">
                    <!-- Populated for print view -->
                </tbody>
            </table>

            <div style="margin-top: 25px; border-top: 2px solid #000; padding-top: 12px; font-size: 11pt;">
                <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 13pt; background-color: #f9fafb; padding: 10px; border: 1px solid #ccc;">
                    <div>当月 差引累計時間 (超過/不足):</div>
                    <div id="printNetTotal" style="font-size: 14pt;"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- Settings & Backup Modal -->
    <div id="settingsModal" class="no-print fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-base text-slate-900 flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                    設定・データ管理
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Job Category Management Section -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-800 uppercase">業務種別の追加・削除</label>
                <div class="flex gap-2">
                    <input type="text" id="newCategoryInput" placeholder="例: A案件, プロジェクトB" class="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brand-500">
                    <button onclick="addJobCategory()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800">
                        追加
                    </button>
                </div>
                <div id="categoryChips" class="flex flex-wrap gap-1.5 pt-1">
                    <!-- Populated via JS -->
                </div>
            </div>

            <hr class="border-slate-100">

            <!-- Backup Code Copy Section -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-800 uppercase">1. データバックアップ (機種変更時)</label>
                <p class="text-xs text-slate-500">全記録をコード化してコピーします。</p>
                <button onclick="copyBackupCode()" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition-colors">
                    <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    バックアップコードをコピー
                </button>
            </div>

            <hr class="border-slate-100">

            <!-- Restore Section -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-800 uppercase">2. データの復元</label>
                <textarea id="restoreInput" rows="2" placeholder="バックアップコードを貼り付け" class="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 font-mono text-slate-700"></textarea>
                <button onclick="restoreData()" class="w-full py-2 px-4 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold text-xs transition-colors shadow-sm">
                    復元を実行する
                </button>
            </div>

            <div class="pt-2 text-right">
                <button onclick="closeSettingsModal()" class="px-4 py-1.5 text-xs font-bold text-slate-500 hover:text-slate-800">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="no-print fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-xl transition-all duration-200 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">通知メッセージ</span>
    </div>

    <script>
        const STORAGE_RECORDS_KEY = 'flextime_diff_records_v3';
        const STORAGE_CATEGORIES_KEY = 'flextime_diff_categories_v3';

        let records = [];
        let jobCategories = ['メイン業務', 'サブ業務'];

        // App Initialization
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            document.getElementById('inputDate').value = formatDateIso(today);
            document.getElementById('monthPicker').value = formatDateMonth(today);

            loadCategories();
            loadRecords();
            renderCategorySelects();
            renderApp();
        });

        // Load Categories from LocalStorage
        function loadCategories() {
            try {
                const stored = localStorage.getItem(STORAGE_CATEGORIES_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        jobCategories = parsed;
                    }
                }
            } catch (e) {
                console.error("Failed to load categories", e);
            }
        }

        // Save Categories
        function saveCategories() {
            try {
                localStorage.setItem(STORAGE_CATEGORIES_KEY, JSON.stringify(jobCategories));
            } catch (e) {
                console.error("Failed to save categories", e);
            }
        }

        // Render Dropdown options for Categories
        function renderCategorySelects() {
            const filterSelect = document.getElementById('jobCategoryFilter');
            const inputSelect = document.getElementById('inputJobCategory');
            const currentFilterVal = filterSelect.value || 'ALL';
            const currentInputVal = inputSelect.value;

            // Filter select
            filterSelect.innerHTML = '<option value="ALL">すべての業務 (全累計)</option>';
            jobCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                filterSelect.appendChild(opt);
            });
            filterSelect.value = currentFilterVal;

            // Input select
            inputSelect.innerHTML = '';
            jobCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                inputSelect.appendChild(opt);
            });
            if (currentInputVal && jobCategories.includes(currentInputVal)) {
                inputSelect.value = currentInputVal;
            }

            // Chips in Settings
            const chipsContainer = document.getElementById('categoryChips');
            chipsContainer.innerHTML = '';
            jobCategories.forEach(cat => {
                const chip = document.createElement('span');
                chip.className = 'inline-flex items-center gap-1 px-2.5 py-1 bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold rounded-lg';
                chip.innerHTML = `
                    ${escapeHtml(cat)}
                    ${jobCategories.length > 1 ? `<button onclick="removeJobCategory('${escapeHtml(cat)}')" class="text-slate-400 hover:text-rose-600 ml-1 font-bold">×</button>` : ''}
                `;
                chipsContainer.appendChild(chip);
            });
        }

        function addJobCategory() {
            const val = document.getElementById('newCategoryInput').value.trim();
            if (!val) return;
            if (!jobCategories.includes(val)) {
                jobCategories.push(val);
                saveCategories();
                renderCategorySelects();
                renderApp();
                showToast(`「${val}」を追加しました`);
            }
            document.getElementById('newCategoryInput').value = '';
        }

        function removeJobCategory(cat) {
            if (jobCategories.length <= 1) {
                showToast("最低1つの業務種別が必要です");
                return;
            }
            jobCategories = jobCategories.filter(c => c !== cat);
            saveCategories();
            renderCategorySelects();
            renderApp();
            showToast("削除しました");
        }

        // Load Records from LocalStorage
        function loadRecords() {
            try {
                const stored = localStorage.getItem(STORAGE_RECORDS_KEY);
                records = stored ? JSON.parse(stored) : [];
            } catch (e) {
                records = [];
                console.error("Failed to load records", e);
            }
        }

        function saveRecords() {
            try {
                localStorage.setItem(STORAGE_RECORDS_KEY, JSON.stringify(records));
            } catch (e) {
                showToast("データの保存に失敗しました");
            }
        }

        // Month Navigation Handler
        function changeMonth(offset) {
            const picker = document.getElementById('monthPicker');
            const current = picker.value;
            if (!current) return;

            const [year, month] = current.split('-').map(Number);
            const date = new Date(year, month - 1 + offset, 1);
            picker.value = formatDateMonth(date);
            renderApp();
        }

        // Form Submit Handler
        function handleFormSubmit(e) {
            e.preventDefault();
            const date = document.getElementById('inputDate').value;
            const category = document.getElementById('inputJobCategory').value;
            const sign = parseInt(document.getElementById('inputSign').value, 10);
            const minutesVal = parseInt(document.getElementById('inputMinutes').value, 10);
            const note = document.getElementById('inputNote').value.trim();

            if (!date || isNaN(minutesVal) || minutesVal <= 0) return;

            const totalMinutes = sign * minutesVal;
            addRecord(date, category, totalMinutes, note);

            document.getElementById('inputNote').value = '';
        }

        // Quick Add Handler (Positive/Negative mins, NO 0m)
        function quickAdd(mins) {
            if (mins === 0) return;
            const date = document.getElementById('inputDate').value;
            const category = document.getElementById('inputJobCategory').value;
            const note = document.getElementById('inputNote').value.trim();

            if (!date) {
                showToast("日付を選択してください");
                return;
            }

            addRecord(date, category, mins, note);
            document.getElementById('inputNote').value = '';
        }

        function addRecord(date, category, minutes, note) {
            if (minutes === 0) return; // Guard against 0 minutes

            const record = {
                id: Date.now().toString(),
                date: date,
                category: category || jobCategories[0],
                minutes: minutes,
                note: note,
                createdAt: new Date().toISOString()
            };

            records.push(record);
            records.sort((a, b) => b.date.localeCompare(a.date));

            saveRecords();

            // Auto shift month filter if recorded month differs
            const recordMonth = date.substring(0, 7);
            if (recordMonth !== document.getElementById('monthPicker').value) {
                document.getElementById('monthPicker').value = recordMonth;
            }

            renderApp();
            showToast("調整時間を登録しました");
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveRecords();
            renderApp();
            showToast("削除しました");
        }

        // Main Render Function
        function renderApp() {
            const selectedMonth = document.getElementById('monthPicker').value;
            const selectedCategory = document.getElementById('jobCategoryFilter').value;

            // Filter records for selected month and category
            const monthFiltered = records.filter(r => r.date.startsWith(selectedMonth));
            const filtered = monthFiltered.filter(r => {
                return selectedCategory === 'ALL' || r.category === selectedCategory;
            });

            // Calculate Totals
            let totalExcessMinutes = 0;
            let totalShortageMinutes = 0;

            filtered.forEach(r => {
                if (r.minutes > 0) totalExcessMinutes += r.minutes;
                if (r.minutes < 0) totalShortageMinutes += Math.abs(r.minutes);
            });

            const netAdjustmentMinutes = totalExcessMinutes - totalShortageMinutes;

            // Update Hero Card UI
            const heroNetValue = document.getElementById('heroNetValue');
            const heroBadge = document.getElementById('heroBadge');
            const heroPulseDot = document.getElementById('heroPulseDot');

            const [year, monthNum] = selectedMonth.split('-').map(Number);
            document.getElementById('heroMonthLabel').innerText = `${year}年${monthNum}月`;

            const signSymbol = netAdjustmentMinutes > 0 ? '+' : (netAdjustmentMinutes < 0 ? '-' : '');
            const absNetMinutes = Math.abs(netAdjustmentMinutes);
            
            heroNetValue.innerText = netAdjustmentMinutes === 0 ? '0分' : `${signSymbol}${formatHoursMinutes(absNetMinutes)}`;

            if (netAdjustmentMinutes > 0) {
                heroNetValue.className = "text-4xl sm:text-5xl font-black tracking-tight text-emerald-400";
                heroBadge.innerText = "超過 (プラス貯金)";
                heroBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                heroPulseDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
            } else if (netAdjustmentMinutes < 0) {
                heroNetValue.className = "text-4xl sm:text-5xl font-black tracking-tight text-rose-400";
                heroBadge.innerText = "不足 (マイナス注意)";
                heroBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30";
                heroPulseDot.className = "w-2 h-2 rounded-full bg-rose-400 animate-pulse";
            } else {
                heroNetValue.className = "text-4xl sm:text-5xl font-black tracking-tight text-brand-400";
                heroBadge.innerText = "プラマイゼロ (差分なし)";
                heroBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-brand-500/20 text-brand-300 border border-brand-500/30";
                heroPulseDot.className = "w-2 h-2 rounded-full bg-brand-400 animate-pulse";
            }

            // Update Excess/Shortage Sub-totals
            document.getElementById('statExcessOnly').innerText = `+${formatHoursMinutes(totalExcessMinutes)}`;
            document.getElementById('statShortageOnly').innerText = `-${formatHoursMinutes(totalShortageMinutes)}`;

            // Render Records List
            renderRecordsList(filtered);

            // Prepare Print View
            renderPrintView(filtered, selectedMonth, selectedCategory, netAdjustmentMinutes);
        }

        // Render List Items
        function renderRecordsList(filteredList) {
            const listEl = document.getElementById('recordsList');
            const emptyEl = document.getElementById('emptyState');
            const countLabel = document.getElementById('recordCountLabel');

            listEl.innerHTML = '';
            countLabel.innerText = `${filteredList.length}件の記録`;

            if (filteredList.length === 0) {
                emptyEl.classList.remove('hidden');
                return;
            }
            emptyEl.classList.add('hidden');

            filteredList.forEach(r => {
                const isExcess = r.minutes > 0;
                const badgeStyle = isExcess 
                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200/80' 
                    : 'bg-rose-50 text-rose-700 border-rose-200/80';
                const signStr = isExcess ? '+' : '-';

                const item = document.createElement('div');
                item.className = 'p-3.5 sm:p-4 flex items-center justify-between hover:bg-slate-50 transition-colors';
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="px-2.5 py-1 rounded-lg border text-xs font-black ${badgeStyle}">
                            ${signStr}${formatHoursMinutes(Math.abs(r.minutes))}
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-slate-900">${formatJapaneseDate(r.date)}</span>
                                <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px] font-semibold">${escapeHtml(r.category || '業務')}</span>
                            </div>
                            ${r.note ? `<div class="text-xs text-slate-500 mt-0.5">${escapeHtml(r.note)}</div>` : ''}
                        </div>
                    </div>
                    <button onclick="deleteRecord('${r.id}')" class="p-2 text-slate-300 hover:text-rose-600 active:text-rose-700 transition-colors" title="削除">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        // Render Print Table
        function renderPrintView(filteredList, monthStr, categoryStr, netMins) {
            document.getElementById('printMonthLabel').innerText = monthStr.replace('-', '年 ') + '月';
            document.getElementById('printJobFilterLabel').innerText = categoryStr === 'ALL' ? '全業務' : categoryStr;
            document.getElementById('printTodayDate').innerText = new Date().toLocaleDateString('ja-JP');

            const tbody = document.getElementById('printTableBody');
            tbody.innerHTML = '';

            filteredList.forEach(r => {
                const tr = document.createElement('tr');
                const isExcess = r.minutes > 0;
                tr.innerHTML = `
                    <td>${r.date}</td>
                    <td>${escapeHtml(r.category || '-')}</td>
                    <td>${isExcess ? '超過 (+)' : '不足 (-)'}</td>
                    <td style="font-weight: bold;">${isExcess ? '+' : '-'}${formatHoursMinutes(Math.abs(r.minutes))}</td>
                    <td>${escapeHtml(r.note || '-')}</td>
                `;
                tbody.appendChild(tr);
            });

            const signSymbol = netMins > 0 ? '+' : (netMins < 0 ? '-' : '');
            document.getElementById('printNetTotal').innerText = netMins === 0 ? '0分' : `${signSymbol}${formatHoursMinutes(Math.abs(netMins))}`;
        }

        // CSV Export (Excel UTF-8 BOM compatibility)
        function exportCSV() {
            const selectedMonth = document.getElementById('monthPicker').value;
            const selectedCategory = document.getElementById('jobCategoryFilter').value;

            const monthFiltered = records.filter(r => r.date.startsWith(selectedMonth));
            const filtered = monthFiltered.filter(r => selectedCategory === 'ALL' || r.category === selectedCategory);

            if (filtered.length === 0) {
                showToast("出力する記録がありません");
                return;
            }

            let csvContent = "\uFEFF日付,業務種別,区分,調整時間(分),調整時間(表記),備考\n";
            filtered.forEach(r => {
                const type = r.minutes > 0 ? "超過" : "不足";
                const formatted = (r.minutes > 0 ? "+" : "-") + formatHoursMinutes(Math.abs(r.minutes));
                const note = (r.note || "").replace(/"/g, '""');
                const cat = (r.category || "基本業務").replace(/"/g, '""');
                csvContent += `"${r.date}","${cat}","${type}","${r.minutes}","${formatted}","${note}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `flextime_diff_${selectedMonth}_${selectedCategory}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function triggerPrint() {
            window.print();
        }

        // Settings Modal Handlers
        function openSettingsModal() {
            renderCategorySelects();
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        // Copy Backup Code
        function copyBackupCode() {
            if (records.length === 0) {
                showToast("保存されているデータがありません");
                return;
            }
            try {
                const dataObj = { records: records, categories: jobCategories };
                const code = btoa(encodeURIComponent(JSON.stringify(dataObj)));

                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = code;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextArea);

                showToast("バックアップコードをコピーしました！");
            } catch (e) {
                showToast("コード生成に失敗しました");
            }
        }

        // Restore Data
        function restoreData() {
            const input = document.getElementById('restoreInput').value.trim();
            if (!input) {
                showToast("コードを貼り付けてください");
                return;
            }

            try {
                const decodedJson = decodeURIComponent(atob(input));
                const parsed = JSON.parse(decodedJson);

                if (Array.isArray(parsed)) {
                    records = parsed;
                } else if (parsed && Array.isArray(parsed.records)) {
                    records = parsed.records;
                    if (Array.isArray(parsed.categories)) {
                        jobCategories = parsed.categories;
                        saveCategories();
                    }
                } else {
                    throw new Error("Format error");
                }

                saveRecords();
                renderCategorySelects();
                renderApp();
                closeSettingsModal();
                document.getElementById('restoreInput').value = '';
                showToast("データを復元しました！");
            } catch (e) {
                showToast("無効なバックアップコードです");
            }
        }

        // Helper Formatting Functions
        function formatHoursMinutes(totalMins) {
            const h = Math.floor(totalMins / 60);
            const m = totalMins % 60;
            if (h === 0) return `${m}分`;
            if (m === 0) return `${h}時間`;
            return `${h}時間${m.toString().padStart(2, '0')}分`;
        }

        function formatDateIso(d) {
            return d.toISOString().split('T')[0];
        }

        function formatDateMonth(d) {
            return d.toISOString().substring(0, 7);
        }

        function formatJapaneseDate(dateStr) {
            const parts = dateStr.split('-');
            if (parts.length < 3) return dateStr;
            return `${parts[0]}年${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日`;
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
