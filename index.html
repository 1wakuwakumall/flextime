<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="フレックス管理">
    <title>フレックスタイム時間管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        input, textarea {
            user-select: text;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white pt-10 pb-6 px-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">フレックス時間管理</h1>
                <p class="text-xs text-indigo-200 mt-0.5">1日7時間標準（30分単位調整）</p>
            </div>
            <button onclick="toggleSettings()" class="p-2 rounded-full hover:bg-indigo-500 transition text-indigo-100" title="設定・バックアップ">
                ⚙️
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <!-- Summary Card -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">通算超過 / 不足時間</h2>
            <div class="flex items-baseline justify-between">
                <div id="totalBadge" class="text-3xl font-extrabold tracking-tight text-slate-900">
                    0時間00分
                </div>
                <span id="statusLabel" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">
                    ±0
                </span>
            </div>
            <div class="mt-3 pt-3 border-t border-slate-100 flex justify-between text-xs text-slate-500">
                <span>登録日数: <strong id="totalCount" class="text-slate-700">0</strong> 日</span>
                <span>今月の累計: <strong id="monthTotal" class="text-slate-700">0時間00分</strong></span>
            </div>
        </section>

        <!-- Input Form -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
            <h2 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-1.5">
                <span>📝</span> 記録を入力
            </h2>

            <form id="recordForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">日付</label>
                    <input type="date" id="inputDate" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">超過・不足の調整（30分単位）</label>
                    
                    <!-- Quick Preset Buttons -->
                    <div class="grid grid-cols-4 gap-1.5 mb-2.5">
                        <button type="button" onclick="setDiffMinutes(60)" class="preset-btn bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 py-2 rounded-lg text-xs font-semibold transition">+1時間</button>
                        <button type="button" onclick="setDiffMinutes(30)" class="preset-btn bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 py-2 rounded-lg text-xs font-semibold transition">+30分</button>
                        <button type="button" onclick="setDiffMinutes(0)" class="preset-btn bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 py-2 rounded-lg text-xs font-semibold transition">プラマイ0</button>
                        <button type="button" onclick="setDiffMinutes(-30)" class="preset-btn bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 py-2 rounded-lg text-xs font-semibold transition">-30分</button>
                    </div>

                    <!-- Custom Selector -->
                    <div class="flex items-center gap-2">
                        <select id="diffSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="180">+3.0時間 (+180分)</option>
                            <option value="150">+2.5時間 (+150分)</option>
                            <option value="120">+2.0時間 (+120分)</option>
                            <option value="90">+1.5時間 (+90分)</option>
                            <option value="60">+1.0時間 (+60分)</option>
                            <option value="30">+0.5時間 (+30分)</option>
                            <option value="0" selected>±0分（7時間きっちり）</option>
                            <option value="-30">-0.5時間 (-30分)</option>
                            <option value="-60">-1.0時間 (-60分)</option>
                            <option value="-90">-1.5時間 (-90分)</option>
                            <option value="-120">-2.0時間 (-120分)</option>
                            <option value="-150">-2.5時間 (-150分)</option>
                            <option value="-180">-3.0時間 (-180分)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">メモ（任意）</label>
                    <input type="text" id="inputMemo" placeholder="例: 早出、プロジェクト残業" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <button type="submit" class="w-full bg-indigo-600 active:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition">
                    記録を保存する
                </button>
            </form>
        </section>

        <!-- Log List -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                    <span>📅</span> 記録一覧
                </h2>
                <span class="text-xs text-slate-400">新しい順</span>
            </div>

            <div id="logList" class="space-y-2.5">
                <!-- Log Items generated here -->
            </div>
        </section>

        <!-- Settings / Backup Modal -->
        <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl space-y-5 animate-slide-up">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        ⚙️ データバックアップと復元
                    </h3>
                    <button onclick="toggleSettings()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">✕</button>
                </div>

                <!-- Export -->
                <div class="space-y-2">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">1. バックアップコードを出力</h4>
                    <p class="text-xs text-slate-500">現在の全記録をコード化してクリップボードにコピーします。機種変更時や保管用にお使いください。</p>
                    <button onclick="copyBackupCode()" class="w-full bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-sm hover:bg-slate-700 transition flex items-center justify-center gap-1.5">
                        <span>📋</span> バックアップコードをコピー
                    </button>
                </div>

                <hr class="border-slate-100">

                <!-- Import -->
                <div class="space-y-2">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">2. コードからデータを復元</h4>
                    <p class="text-xs text-slate-500">コピーしておいたバックアップコードを下に貼り付けて復元します。</p>
                    <textarea id="importCodeInput" rows="3" placeholder="ここにバックアップコードを貼り付けてください" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    <button onclick="restoreFromCode()" class="w-full bg-amber-600 text-white font-semibold py-2.5 rounded-xl text-sm hover:bg-amber-700 transition flex items-center justify-center gap-1.5">
                        <span>🔄</span> データを復元する
                    </button>
                </div>

                <div class="pt-2">
                    <button onclick="toggleSettings()" class="w-full bg-slate-100 text-slate-600 font-semibold py-2.5 rounded-xl text-sm">
                        閉じる
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        const STORAGE_KEY = 'flextime_app_data_v1';

        // Initial Setup
        document.addEventListener('DOMContentLoaded', () => {
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inputDate').value = today;
            
            renderApp();
        });

        // Get stored data
        function getData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return { records: [] };
            try {
                return JSON.parse(raw);
            } catch (e) {
                return { records: [] };
            }
        }

        // Save data
        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            renderApp();
        }

        // Preset Diff Buttons
        function setDiffMinutes(mins) {
            document.getElementById('diffSelect').value = mins;
        }

        // Form Submit
        function handleFormSubmit(e) {
            e.preventDefault();
            const date = document.getElementById('inputDate').value;
            const diffMinutes = parseInt(document.getElementById('diffSelect').value, 10);
            const memo = document.getElementById('inputMemo').value.trim();

            if (!date) return;

            const data = getData();
            // Check if record exists for this date -> update or insert
            const existingIndex = data.records.findIndex(r => r.date === date);

            const newRecord = {
                id: existingIndex >= 0 ? data.records[existingIndex].id : Date.now().toString(),
                date: date,
                diffMinutes: diffMinutes,
                memo: memo
            };

            if (existingIndex >= 0) {
                data.records[existingIndex] = newRecord;
            } else {
                data.records.push(newRecord);
            }

            // Sort by date descending
            data.records.sort((a, b) => new Date(b.date) - new Date(a.date));

            saveData(data);

            // Reset Memo
            document.getElementById('inputMemo').value = '';
            alert('記録を保存しました');
        }

        // Delete Record
        function deleteRecord(id) {
            if (!confirm('この記録を削除しますか？')) return;
            const data = getData();
            data.records = data.records.filter(r => r.id !== id);
            saveData(data);
        }

        // Format Minutes to String (e.g. +1時間30分, -0時間30分)
        function formatMinutes(totalMins) {
            const isNegative = totalMins < 0;
            const absMins = Math.abs(totalMins);
            const hours = Math.floor(absMins / 60);
            const mins = absMins % 60;

            const sign = isNegative ? '-' : (totalMins > 0 ? '+' : '');
            if (hours === 0 && mins === 0) return '±0分';
            
            let res = sign;
            if (hours > 0) res += `${hours}時間`;
            if (mins > 0) res += `${mins}分`;
            return res;
        }

        // Main Render Function
        function renderApp() {
            const data = getData();
            const records = data.records || [];

            // Calculate Totals
            let totalDiff = 0;
            const currentMonthStr = new Date().toISOString().substring(0, 7); // YYYY-MM
            let monthDiff = 0;

            records.forEach(r => {
                totalDiff += r.diffMinutes;
                if (r.date && r.date.startsWith(currentMonthStr)) {
                    monthDiff += r.diffMinutes;
                }
            });

            // Render Header Status
            const totalBadge = document.getElementById('totalBadge');
            const statusLabel = document.getElementById('statusLabel');

            totalBadge.textContent = formatMinutes(totalDiff);
            
            if (totalDiff > 0) {
                totalBadge.className = "text-3xl font-extrabold tracking-tight text-emerald-600";
                statusLabel.textContent = "超過中";
                statusLabel.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700";
            } else if (totalDiff < 0) {
                totalBadge.className = "text-3xl font-extrabold tracking-tight text-rose-600";
                statusLabel.textContent = "不足中";
                statusLabel.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-700";
            } else {
                totalBadge.className = "text-3xl font-extrabold tracking-tight text-slate-800";
                statusLabel.textContent = "±0";
                statusLabel.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600";
            }

            document.getElementById('totalCount').textContent = records.length;
            document.getElementById('monthTotal').textContent = formatMinutes(monthDiff);

            // Render Log List
            const logListEl = document.getElementById('logList');
            logListEl.innerHTML = '';

            if (records.length === 0) {
                logListEl.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-xs">
                        まだ記録はありません。<br>上のフォームから登録してください。
                    </div>
                `;
                return;
            }

            records.forEach(r => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100";

                let diffClass = "text-slate-600 bg-slate-200/60";
                if (r.diffMinutes > 0) diffClass = "text-emerald-700 bg-emerald-100/80 font-bold";
                if (r.diffMinutes < 0) diffClass = "text-rose-700 bg-rose-100/80 font-bold";

                item.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="text-sm font-semibold text-slate-800">${r.date}</div>
                        ${r.memo ? `<div class="text-xs text-slate-500">${escapeHtml(r.memo)}</div>` : ''}
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="px-2.5 py-1 rounded-lg text-xs ${diffClass}">
                            ${formatMinutes(r.diffMinutes)}
                        </span>
                        <button onclick="deleteRecord('${r.id}')" class="text-slate-300 hover:text-rose-500 text-sm p-1 transition">
                            🗑️
                        </button>
                    </div>
                `;
                logListEl.appendChild(item);
            });
        }

        // Toggle Modal
        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        // Copy Backup Code
        function copyBackupCode() {
            const data = getData();
            if (!data.records || data.records.length === 0) {
                alert('バックアップするデータがまだありません。');
                return;
            }
            try {
                const jsonStr = JSON.stringify(data);
                // Convert to Base64 (UTF-8 safe)
                const code = btoa(encodeURIComponent(jsonStr));
                
                navigator.clipboard.writeText(code).then(() => {
                    alert('バックアップコードをクリップボードにコピーしました！\nメモ帳などに貼り付けて大切に保管してください。');
                }).catch(() => {
                    // Fallback
                    prompt('以下のバックアップコードをすべて選択してコピーしてください:', code);
                });
            } catch (e) {
                alert('コード生成に失敗しました: ' + e.message);
            }
        }

        // Restore from Code
        function restoreFromCode() {
            const codeInput = document.getElementById('importCodeInput').value.trim();
            if (!codeInput) {
                alert('バックアップコードを入力してください。');
                return;
            }

            if (!confirm('データを復元すると、現在入力されているデータは上書きされます。よろしいですか？')) {
                return;
            }

            try {
                let jsonStr = '';
                try {
                    jsonStr = decodeURIComponent(atob(codeInput));
                } catch (e) {
                    // Fallback to raw JSON if not base64
                    jsonStr = codeInput;
                }

                const parsed = JSON.parse(jsonStr);
                if (!parsed || !Array.isArray(parsed.records)) {
                    throw new Error('無効なデータ構造です。');
                }

                saveData(parsed);
                document.getElementById('importCodeInput').value = '';
                toggleSettings();
                alert('データの復元が完了しました！');
            } catch (e) {
                alert('復元に失敗しました。正しいバックアップコードか確認してください。');
            }
        }

        // Helper
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
