<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フレックスタイム管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white !important; color: black !important; font-size: 11pt; padding: 0; margin: 0; }
      .container { max-width: 100% !important; width: 100% !important; padding: 0 !important; margin: 0 !important; }
      .card-print { border: none !important; box-shadow: none !important; padding: 0 !important; }
      table { width: 100%; border-collapse: collapse; margin-top: 15px; }
      th, td { border: 1px solid #000 !important; padding: 6px 10px !important; text-align: left; }
      th { background-color: #f2f2f2 !important; }
    }
    .print-only { display: none; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12 font-sans antialiased">

  <!-- Header (Screen only) -->
  <header class="no-print bg-indigo-700 text-white shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
        <span>⏱️️</span> フレックスタイム管理
      </h1>
      <button onclick="openSettingsModal()" class="p-2 rounded-full hover:bg-indigo-600 active:scale-95 transition-transform" title="設定">
        <span class="text-xl">⚙️</span>
      </button>
    </div>
  </header>

  <!-- Print Header (Print only) -->
  <div class="print-only">
    <h1 class="text-2xl font-bold text-center mb-4">フレックスタイム勤務調整報告書</h1>
    <div class="grid grid-cols-2 gap-2 mb-4 text-sm border-b pb-3">
      <div><strong>会社名・所属：</strong> <span id="printCompany"></span></div>
      <div><strong>氏名：</strong> <span id="printName"></span></div>
      <div><strong>対象年月：</strong> <span id="printMonth"></span></div>
      <div><strong>当月差分累計：</strong> <span id="printMonthlyTotal"></span></div>
      <div class="col-span-2"><strong>全期間差分累計：</strong> <span id="printAllTimeTotal"></span></div>
    </div>
  </div>

  <main class="max-w-md mx-auto px-4 mt-4">

    <!-- Dashboard Card -->
    <div class="no-print bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-4">
      
      <!-- Month Selector -->
      <div class="flex items-center justify-between mb-4 bg-slate-50 rounded-xl p-1.5 border border-slate-200">
        <button onclick="changeMonth(-1)" class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 shadow-sm text-sm font-bold text-slate-700 hover:bg-slate-100 active:scale-95 transition">
          ＜ 前月
        </button>
        <div id="currentMonthDisplay" class="text-base font-bold text-slate-800">2026年10月</div>
        <button onclick="changeMonth(1)" class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 shadow-sm text-sm font-bold text-slate-700 hover:bg-slate-100 active:scale-95 transition">
          次月 ＞
        </button>
      </div>

      <!-- Totals Display (Monthly & All-time) -->
      <div class="grid grid-cols-2 gap-3">
        <!-- 当月差分累計 -->
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 text-center shadow-inner">
          <div class="text-xs font-bold text-indigo-600 mb-1">当月差分累計</div>
          <div id="monthlyTotalDisplay" class="text-xl font-extrabold text-indigo-900">+0時間00分</div>
        </div>

        <!-- 全期間差分累計 -->
        <div class="bg-purple-50 border border-purple-100 rounded-xl p-3 text-center shadow-inner">
          <div class="text-xs font-bold text-purple-600 mb-1">全期間差分累計</div>
          <div id="allTimeTotalDisplay" class="text-xl font-extrabold text-purple-900">+0時間00分</div>
        </div>
      </div>
    </div>

    <!-- Quick Adjustment Section -->
    <div class="no-print bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-4">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">クイック調整 (ワンタップ)</h2>
      
      <!-- Plus Buttons -->
      <div class="grid grid-cols-4 gap-2 mb-2">
        <button onclick="quickAdd(30)" class="py-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 font-bold text-sm hover:bg-emerald-100 active:scale-95 transition">+30分</button>
        <button onclick="quickAdd(60)" class="py-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 font-bold text-sm hover:bg-emerald-100 active:scale-95 transition">+1時間</button>
        <button onclick="quickAdd(90)" class="py-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 font-bold text-sm hover:bg-emerald-100 active:scale-95 transition">+1.5時間</button>
        <button onclick="quickAdd(120)" class="py-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 font-bold text-sm hover:bg-emerald-100 active:scale-95 transition">+2時間</button>
      </div>

      <!-- Minus Buttons -->
      <div class="grid grid-cols-4 gap-2">
        <button onclick="quickAdd(-30)" class="py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 font-bold text-sm hover:bg-rose-100 active:scale-95 transition">-30分</button>
        <button onclick="quickAdd(-60)" class="py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 font-bold text-sm hover:bg-rose-100 active:scale-95 transition">-1時間</button>
        <button onclick="quickAdd(-90)" class="py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 font-bold text-sm hover:bg-rose-100 active:scale-95 transition">-1.5時間</button>
        <button onclick="quickAdd(-120)" class="py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 font-bold text-sm hover:bg-rose-100 active:scale-95 transition">-2時間</button>
      </div>
    </div>

    <!-- Custom Entry Form -->
    <details class="no-print bg-white rounded-2xl shadow-sm border border-slate-200 mb-4 overflow-hidden group">
      <summary class="px-4 py-3 font-bold text-sm text-slate-600 flex items-center justify-between cursor-pointer select-none bg-slate-50 hover:bg-slate-100">
        <span>📝 詳細・カスタム入力フォーム</span>
        <span class="text-xs transition-transform group-open:rotate-180">▼</span>
      </summary>
      <form onsubmit="handleCustomSubmit(event)" class="p-4 space-y-3 border-t border-slate-100">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">日付</label>
          <input type="date" id="entryDate" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">調整時間</label>
          <select id="entryAmount" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="120">+2時間00分 (+120分)</option>
            <option value="90">+1時間30分 (+90分)</option>
            <option value="60">+1時間00分 (+60分)</option>
            <option value="30" selected>+0時間30分 (+30分)</option>
            <option value="-30">-0時間30分 (-30分)</option>
            <option value="-60">-1時間00分 (-60分)</option>
            <option value="-90">-1時間30分 (-90分)</option>
            <option value="-120">-2時間00分 (-120分)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">備考 (任意)</label>
          <input type="text" id="entryNote" placeholder="例: 早出、残業調整など" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white font-bold text-sm rounded-xl hover:bg-indigo-700 active:scale-95 transition">
          記録を追加する
        </button>
      </form>
    </details>

    <!-- Records List & Export Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-4 card-print">
      
      <!-- Submitter Info (Screen only) -->
      <div class="no-print mb-4 p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
        <h3 class="text-xs font-bold text-slate-500 uppercase">提出者情報 (自動保存)</h3>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-500">会社名・所属</label>
            <input type="text" id="companyInput" onchange="saveUserInfo()" placeholder="〇〇株式会社" class="w-full px-2.5 py-1.5 text-xs border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-500">氏名</label>
            <input type="text" id="userInput" onchange="saveUserInfo()" placeholder="山田 太郎" class="w-full px-2.5 py-1.5 text-xs border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>
      </div>

      <!-- Export Action Buttons -->
      <div class="no-print flex gap-2 mb-4">
        <button onclick="exportCSV()" class="flex-1 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl hover:bg-emerald-700 active:scale-95 transition flex items-center justify-center gap-1">
          <span>📊</span> CSV出力
        </button>
        <button onclick="printPDF()" class="flex-1 py-2 bg-slate-700 text-white text-xs font-bold rounded-xl hover:bg-slate-800 active:scale-95 transition flex items-center justify-center gap-1">
          <span>🖨️</span> PDF / 印刷
        </button>
      </div>

      <!-- Records Table Header -->
      <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-2">
        <h2 class="text-sm font-bold text-slate-800">当月の記録一覧</h2>
        <span id="recordCount" class="text-xs text-slate-400 no-print">0件</span>
      </div>

      <!-- Table Container -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="text-xs text-slate-400 border-b border-slate-200">
              <th class="py-2 px-1 font-bold">日付</th>
              <th class="py-2 px-1 font-bold">調整時間</th>
              <th class="py-2 px-1 font-bold">備考</th>
              <th class="py-2 px-1 font-bold text-right no-print">操作</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody">
            <!-- Records rendered dynamically -->
          </tbody>
        </table>
      </div>

    </div>

  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="no-print fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-5 border border-slate-100 space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-slate-800">⚙️ 設定・バックアップ</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
      </div>

      <!-- Backup Code Export -->
      <div class="space-y-1">
        <label class="block text-xs font-bold text-slate-600">バックアップコード (データ引継ぎ用)</label>
        <textarea id="backupExportCode" readonly class="w-full h-16 text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg font-mono resize-none focus:outline-none"></textarea>
        <button onclick="copyBackupCode()" class="w-full py-2 bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs font-bold rounded-lg hover:bg-indigo-100 active:scale-95 transition">
          バックアップコードをコピー
        </button>
      </div>

      <!-- Backup Code Import -->
      <div class="space-y-1 border-t pt-3">
        <label class="block text-xs font-bold text-slate-600">復元用コードの貼り付け</label>
        <textarea id="backupImportCode" placeholder="ここにバックアップコードを貼り付け" class="w-full h-16 text-xs p-2 border border-slate-200 rounded-lg font-mono resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <button onclick="restoreBackupCode()" class="w-full py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700 active:scale-95 transition">
          データを復元する
        </button>
      </div>

      <!-- Clear All -->
      <div class="border-t pt-3">
        <button onclick="clearAllData()" class="w-full py-2 bg-rose-50 text-rose-600 text-xs font-bold rounded-lg hover:bg-rose-100 transition">
          全データを削除・初期化
        </button>
      </div>
    </div>
  </div>

  <script>
    // State
    let entries = JSON.parse(localStorage.getItem('flextime_entries')) || [];
    let companyName = localStorage.getItem('flextime_company') || '';
    let userName = localStorage.getItem('flextime_name') || '';

    // Initialize Current Year Month
    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth() + 1; // 1-12

    // DOM Elements
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('companyInput').value = companyName;
      document.getElementById('userInput').value = userName;
      document.getElementById('entryDate').value = getTodayString();
      render();
    });

    function getTodayString() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatYearMonth(y, m) {
      return `${y}-${String(m).padStart(2, '0')}`;
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
      } else if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
      }
      render();
    }

    function render() {
      const targetYM = formatYearMonth(currentYear, currentMonth);

      // Display Current Month
      document.getElementById('currentMonthDisplay').textContent = `${currentYear}年${currentMonth}月`;

      // Filter entries for selected month
      const monthlyEntries = entries.filter(e => e.date.startsWith(targetYM));
      monthlyEntries.sort((a, b) => new Date(a.date) - new Date(b.date));

      // Calculate Monthly Total
      const monthlyTotal = monthlyEntries.reduce((sum, e) => sum + Number(e.amount), 0);

      // Calculate All-Time Total
      const allTimeTotal = entries.reduce((sum, e) => sum + Number(e.amount), 0);

      // Render Totals
      document.getElementById('monthlyTotalDisplay').textContent = formatMinutesText(monthlyTotal);
      document.getElementById('allTimeTotalDisplay').textContent = formatMinutesText(allTimeTotal);

      // Render Count
      document.getElementById('recordCount').textContent = `${monthlyEntries.length}件`;

      // Render Table
      const tbody = document.getElementById('recordsTableBody');
      tbody.innerHTML = '';

      if (monthlyEntries.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="py-6 text-center text-xs text-slate-400">
              この月の記録はありません
            </td>
          </tr>
        `;
      } else {
        monthlyEntries.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = 'border-b border-slate-100 hover:bg-slate-50/50';

          const isPositive = item.amount > 0;
          const badgeClass = isPositive 
            ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
            : 'bg-rose-50 text-rose-700 border-rose-200';

          const dateFormatted = formatDateWithDay(item.date);

          tr.innerHTML = `
            <td class="py-2.5 px-1 font-medium text-xs text-slate-700 whitespace-nowrap">${dateFormatted}</td>
            <td class="py-2.5 px-1 whitespace-nowrap">
              <span class="inline-block px-2 py-0.5 rounded-md text-xs font-bold border ${badgeClass}">
                ${formatMinutesText(item.amount)}
              </span>
            </td>
            <td class="py-2.5 px-1 text-xs text-slate-600">${escapeHtml(item.note || '')}</td>
            <td class="py-2.5 px-1 text-right no-print">
              <button onclick="deleteEntry('${item.id}')" class="text-slate-400 hover:text-rose-600 font-bold p-1 transition" title="削除">
                🗑️
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      // Update Print Header Info
      document.getElementById('printCompany').textContent = companyName || '（未入力）';
      document.getElementById('printName').textContent = userName || '（未入力）';
      document.getElementById('printMonth').textContent = `${currentYear}年${currentMonth}月`;
      document.getElementById('printMonthlyTotal').textContent = formatMinutesText(monthlyTotal);
      document.getElementById('printAllTimeTotal').textContent = formatMinutesText(allTimeTotal);

      // Update Backup Code Textarea
      updateBackupCodeDisplay();
    }

    function formatMinutesText(mins) {
      const sign = mins > 0 ? '+' : (mins < 0 ? '-' : '');
      const abs = Math.abs(mins);
      const hours = Math.floor(abs / 60);
      const minutes = abs % 60;
      return `${sign}${hours}時間${String(minutes).padStart(2, '0')}分`;
    }

    function formatDateWithDay(dateStr) {
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      const [y, m, d] = dateStr.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const dayName = days[dateObj.getDay()];
      return `${m}/${d}(${dayName})`;
    }

    function quickAdd(amount) {
      const targetYM = formatYearMonth(currentYear, currentMonth);
      let dateVal = document.getElementById('entryDate').value;
      if (!dateVal.startsWith(targetYM)) {
        dateVal = `${targetYM}-01`;
      }

      const newEntry = {
        id: Date.now().toString(),
        date: dateVal,
        amount: Number(amount),
        note: ''
      };

      entries.push(newEntry);
      saveEntries();
      render();
    }

    function handleCustomSubmit(e) {
      e.preventDefault();
      const dateVal = document.getElementById('entryDate').value;
      const amountVal = Number(document.getElementById('entryAmount').value);
      const noteVal = document.getElementById('entryNote').value.trim();

      if (!dateVal || isNaN(amountVal)) return;

      const newEntry = {
        id: Date.now().toString(),
        date: dateVal,
        amount: amountVal,
        note: noteVal
      };

      entries.push(newEntry);
      saveEntries();
      document.getElementById('entryNote').value = '';
      render();
    }

    function deleteEntry(id) {
      if (confirm('この記録を削除してもよろしいですか？')) {
        entries = entries.filter(e => e.id !== id);
        saveEntries();
        render();
      }
    }

    function saveEntries() {
      localStorage.setItem('flextime_entries', JSON.stringify(entries));
    }

    function saveUserInfo() {
      companyName = document.getElementById('companyInput').value.trim();
      userName = document.getElementById('userInput').value.trim();
      localStorage.setItem('flextime_company', companyName);
      localStorage.setItem('flextime_name', userName);
      render();
    }

    function exportCSV() {
      const targetYM = formatYearMonth(currentYear, currentMonth);
      const monthlyEntries = entries.filter(e => e.date.startsWith(targetYM));
      monthlyEntries.sort((a, b) => new Date(a.date) - new Date(b.date));

      const monthlyTotal = monthlyEntries.reduce((sum, e) => sum + Number(e.amount), 0);
      const allTimeTotal = entries.reduce((sum, e) => sum + Number(e.amount), 0);

      let csv = '\uFEFF'; // UTF-8 BOM
      csv += `会社名・所属,${companyName || ''}\n`;
      csv += `氏名,${userName || ''}\n`;
      csv += `対象年月,${currentYear}年${currentMonth}月\n`;
      csv += `当月差分累計,${formatMinutesText(monthlyTotal)}\n`;
      csv += `全期間差分累計,${formatMinutesText(allTimeTotal)}\n\n`;

      csv += `日付,調整時間(分),調整時間(表示),備考\n`;

      monthlyEntries.forEach(item => {
        const noteEscaped = `"${(item.note || '').replace(/"/g, '""')}"`;
        csv += `${item.date},${item.amount},${formatMinutesText(item.amount)},${noteEscaped}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `flextime_${targetYM}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function printPDF() {
      window.print();
    }

    // Modal & Backup
    function openSettingsModal() {
      document.getElementById('settingsModal').classList.remove('hidden');
      updateBackupCodeDisplay();
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function updateBackupCodeDisplay() {
      const payload = {
        entries: entries,
        company: companyName,
        name: userName
      };
      try {
        const jsonStr = JSON.stringify(payload);
        const code = btoa(unescape(encodeURIComponent(jsonStr)));
        document.getElementById('backupExportCode').value = code;
      } catch (e) {
        document.getElementById('backupExportCode').value = '';
      }
    }

    function copyBackupCode() {
      const codeArea = document.getElementById('backupExportCode');
      codeArea.select();
      navigator.clipboard.writeText(codeArea.value).then(() => {
        alert('バックアップコードをクリップボードにコピーしました！');
      }).catch(() => {
        alert('コピーに失敗しました。手動で選択してコピーしてください。');
      });
    }

    function restoreBackupCode() {
      const inputCode = document.getElementById('backupImportCode').value.trim();
      if (!inputCode) {
        alert('復元用コードを入力してください。');
        return;
      }

      if (!confirm('現在のデータが上書きされます。復元を実行しますか？')) return;

      try {
        const jsonStr = decodeURIComponent(escape(atob(inputCode)));
        const data = JSON.parse(jsonStr);

        if (data && Array.isArray(data.entries)) {
          entries = data.entries;
          companyName = data.company || '';
          userName = data.name || '';

          localStorage.setItem('flextime_entries', JSON.stringify(entries));
          localStorage.setItem('flextime_company', companyName);
          localStorage.setItem('flextime_name', userName);

          document.getElementById('companyInput').value = companyName;
          document.getElementById('userInput').value = userName;
          document.getElementById('backupImportCode').value = '';

          render();
          closeSettingsModal();
          alert('データの復元が完了しました！');
        } else {
          alert('無効なバックアップコードです。');
        }
      } catch (e) {
        alert('コードの解析に失敗しました。正しいコードか確認してください。');
      }
    }

    function clearAllData() {
      if (confirm('【警告】すべての記録と提出者情報を完全に削除します。よろしいですか？')) {
        localStorage.clear();
        entries = [];
        companyName = '';
        userName = '';
        document.getElementById('companyInput').value = '';
        document.getElementById('userInput').value = '';
        render();
        closeSettingsModal();
        alert('データを初期化しました。');
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
