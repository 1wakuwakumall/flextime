<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>フレックスタイム超過・不足管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; font-size: 11pt; padding: 0 !important; }
            .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; max-width: none !important; }
            table { width: 100%; border-collapse: collapse; margin-top: 16px; }
            th, td { border: 1px solid #333 !important; padding: 8px 10px !important; text-align: left; font-size: 10pt; }
            th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        .print-only { display: none; }
        body { overscroll-behavior-y: none; }
        .tap-highlight-transparent { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans antialiased pb-12">

    <!-- App Header (No Print) -->
    <header class="no-print bg-slate-900 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-500 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-none text-white">フレックス時間管理</h1>
                    <span class="text-[10px] text-slate-400 font-medium">超過・不足の差分累計</span>
                </div>
            </div>
            
            <!-- Settings Button -->
            <button type="button" onclick="openSettingsModal()" class="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800 active:bg-slate-700 transition-colors tap-highlight-transparent" title="設定・データ引継ぎ" aria-label="設定">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto w-full px-4 pt-4 pb-8 space-y-4 flex-1">

        <!-- Print-only Header -->
        <div class="print-only">
            <h1 class="text-2xl font-bold text-center mb-1">フレックスタイム勤務結果報告書</h1>
            <div class="border-b-2 border-slate-800 my-2"></div>
            <div class="grid grid-cols-2 gap-4 my-3 text-sm">
                <div>
                    <p><strong>会社名・所属：</strong> <span id="printCompanyDisplay">-</span></p>
                    <p><strong>氏名：</strong> <span id="printUserDisplay">-</span></p>
                </div>
                <div class="text-right">
                    <p><strong>対象年月：</strong> <span id="printTargetMonthDisplay">-</span></p>
                    <p><strong>当月累計差分：</strong> <span id="printTotalDisplay" class="font-bold">-</span></p>
                </div>
            </div>
        </div>

        <!-- Month Selector Bar (No Print) -->
        <section class="no-print bg-white rounded-2xl p-3 shadow-sm border border-slate-200/80 flex items-center justify-between">
            <button type="button" onclick="changeMonth(-1)" class="p-2 rounded-xl text-slate-600 hover:bg-slate-100 active:bg-slate-200 transition-colors tap-highlight-transparent" aria-label="前月">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div class="text-center">
                <span id="currentMonthDisplay" class="text-lg font-bold text-slate-800">2026年10月</span>
            </div>
            <button type="button" onclick="changeMonth(1)" class="p-2 rounded-xl text-slate-600 hover:bg-slate-100 active:bg-slate-200 transition-colors tap-highlight-transparent" aria-label="次月">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </section>

        <!-- Dashboard Card (No Print) -->
        <section class="no-print bg-white rounded-3xl p-6 shadow-sm border border-slate-200/80 text-center relative overflow-hidden">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">当月 差分累計</p>
            <div id="dashboardTotalDisplay" class="text-4xl sm:text-5xl font-black tracking-tight my-2 text-slate-800">
                0<span class="text-xl font-normal text-slate-500 ml-1">分</span>
            </div>
            <p id="dashboardStatusSub" class="text-xs text-slate-500">当月の超過・不足時間はありません</p>
        </section>

        <!-- Entry Form (No Print) -->
        <section class="no-print bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-4">
            <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                新しい記録を追加
            </h2>

            <div class="space-y-3">
                <!-- Date Input -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1" for="entryDate">日付</label>
                    <input type="date" id="entryDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all outline-none">
                </div>

                <!-- Minutes Input Selection (Quick Buttons) -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1.5">超過・不足時間 (30分単位)</label>
                    
                    <!-- Positive Quick Buttons -->
                    <div class="mb-2">
                        <span class="text-[10px] font-bold text-emerald-600 block mb-1">【超過 (+)】</span>
                        <div class="grid grid-cols-4 gap-1.5">
                            <button type="button" onclick="selectQuickMinutes(30)" class="quick-btn py-2 text-xs font-bold rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-700 active:bg-emerald-600 active:text-white transition-all tap-highlight-transparent" data-minutes="30">+30分</button>
                            <button type="button" onclick="selectQuickMinutes(60)" class="quick-btn py-2 text-xs font-bold rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-700 active:bg-emerald-600 active:text-white transition-all tap-highlight-transparent" data-minutes="60">+1時間</button>
                            <button type="button" onclick="selectQuickMinutes(90)" class="quick-btn py-2 text-xs font-bold rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-700 active:bg-emerald-600 active:text-white transition-all tap-highlight-transparent" data-minutes="90">+1.5時間</button>
                            <button type="button" onclick="selectQuickMinutes(120)" class="quick-btn py-2 text-xs font-bold rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-700 active:bg-emerald-600 active:text-white transition-all tap-highlight-transparent" data-minutes="120">+2時間</button>
                        </div>
                    </div>

                    <!-- Negative Quick Buttons -->
                    <div>
                        <span class="text-[10px] font-bold text-rose-600 block mb-1">【不足 (-)】</span>
                        <div class="grid grid-cols-4 gap-1.5">
                            <button type="button" onclick="selectQuickMinutes(-30)" class="quick-btn py-2 text-xs font-bold rounded-xl border border-rose-200 bg-rose-50 text-rose-700 active:bg-rose-600 active:text-white transition-all tap-highlight-transparent" data-minutes="-30">-30分</button>
                            <button type="button" onclick="selectQuickMinutes(-60)" class="quick-btn py-2 text-xs font-bold rounded-xl border border-rose-200 bg-rose-50 text-rose-700 active:bg-rose-600 active:text-white transition-all tap-highlight-transparent" data-minutes="-60">-1時間</button>
                            <button type="button" onclick="selectQuickMinutes(-90)" class="quick-btn py-2 text-xs font-bold rounded-xl border border-rose-200 bg-rose-50 text-rose-700 active:bg-rose-600 active:text-white transition-all tap-highlight-transparent" data-minutes="-90">-1.5時間</button>
                            <button type="button" onclick="selectQuickMinutes(-120)" class="quick-btn py-2 text-xs font-bold rounded-xl border border-rose-200 bg-rose-50 text-rose-700 active:bg-rose-600 active:text-white transition-all tap-highlight-transparent" data-minutes="-120">-2時間</button>
                        </div>
                    </div>
                    <input type="hidden" id="selectedMinutes" value="30">
                </div>

                <!-- Note Input -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1" for="entryNote">メモ (任意)</label>
                    <input type="text" id="entryNote" placeholder="業務理由や補足など" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all outline-none">
                </div>

                <button type="button" onclick="addRecord()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-sm shadow-md active:scale-[0.99] transition-all tap-highlight-transparent flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    記録を追加する
                </button>
            </div>
        </section>

        <!-- Records List Card -->
        <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-4 print-container">
            <!-- Header for Screen -->
            <div class="no-print flex flex-col space-y-3 pb-3 border-b border-slate-100">
                <div class="flex items-center justify-between">
                    <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        月間記録一覧
                    </h2>
                </div>

                <!-- Submission User Profile Inputs (Auto Saved) -->
                <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200/80 space-y-2">
                    <span class="text-[11px] font-bold text-slate-500 block">【提出者情報 (PDF・CSV出力用)】</span>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                            <input type="text" id="companyInput" placeholder="会社名・所属部門" oninput="saveUserInfo()" class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-brand-500 outline-none">
                        </div>
                        <div>
                            <input type="text" id="userInput" placeholder="氏名" oninput="saveUserInfo()" class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-brand-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Export Action Buttons -->
                <div class="flex items-center gap-2 pt-1">
                    <button type="button" onclick="exportCSV()" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold py-2 px-3 rounded-xl text-xs border border-emerald-200 flex items-center justify-center gap-1.5 transition-colors tap-highlight-transparent">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        📊 CSV出力
                    </button>
                    <button type="button" onclick="printReport()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-3 rounded-xl text-xs border border-slate-300 flex items-center justify-center gap-1.5 transition-colors tap-highlight-transparent">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        🖨️ PDF / 印刷
                    </button>
                </div>
            </div>

            <!-- List Container (Screen View) -->
            <div id="recordsList" class="no-print space-y-2">
                <!-- Dynamic Content inserted via JS -->
            </div>

            <!-- Table View (Print Only) -->
            <div class="print-only">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 25%;">日付</th>
                            <th style="width: 25%;">超過・不足時間</th>
                            <th style="width: 50%;">メモ</th>
                        </tr>
                    </thead>
                    <tbody id="printTableBody">
                        <!-- Dynamic Content inserted via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Settings & Backup Modal (No Print) -->
    <div id="settingsModal" class="no-print fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 transform transition-all">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                    設定・データバックアップ
                </h3>
                <button type="button" onclick="closeSettingsModal()" class="p-1 rounded-lg text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="space-y-4">
                <!-- Backup Output Section -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">データバックアップ (コード出力)</label>
                    <p class="text-[11px] text-slate-500 mb-2">機種変更時や他端末へ移行する際、以下のコードをコピーして保存してください。</p>
                    <button type="button" onclick="generateBackupCode()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2 rounded-xl text-xs border border-slate-300 transition-colors mb-2">
                        バックアップコードを生成 & コピー
                    </button>
                </div>

                <hr class="border-slate-100">

                <!-- Restore Input Section -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1" for="restoreCodeInput">データ復元 (コード読み込み)</label>
                    <p class="text-[11px] text-slate-500 mb-2">保存しておいたバックアップコードを貼り付けて復元します。</p>
                    <textarea id="restoreCodeInput" rows="3" placeholder="バックアップコードをここに貼り付け" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-mono focus:ring-2 focus:ring-brand-500 outline-none mb-2"></textarea>
                    <button type="button" onclick="restoreFromCode()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2 rounded-xl text-xs shadow-md transition-colors">
                        データを復元する
                    </button>
                </div>
            </div>

            <!-- Toast / Status Message -->
            <div id="modalToast" class="hidden p-2.5 rounded-xl text-xs font-bold text-center"></div>
        </div>
    </div>

    <script>
        // Key State Management
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); // 0 - 11

        // Records Array
        let records = [];

        // Load Initial Data on Startup
        window.addEventListener('DOMContentLoaded', () => {
            loadStoredData();
            initFormDefaults();
            render();
        });

        function loadStoredData() {
            try {
                const savedRecords = localStorage.getItem('flextime_records');
                if (savedRecords) {
                    records = JSON.parse(savedRecords);
                }
                const savedCompany = localStorage.getItem('flextime_company');
                if (savedCompany) {
                    document.getElementById('companyInput').value = savedCompany;
                }
                const savedUser = localStorage.getItem('flextime_user_name');
                if (savedUser) {
                    document.getElementById('userInput').value = savedUser;
                }
            } catch (e) {
                console.error("Failed to load local storage:", e);
            }
        }

        function saveRecords() {
            localStorage.setItem('flextime_records', JSON.stringify(records));
        }

        function saveUserInfo() {
            const company = document.getElementById('companyInput').value;
            const user = document.getElementById('userInput').value;
            localStorage.setItem('flextime_company', company);
            localStorage.setItem('flextime_user_name', user);
        }

        function initFormDefaults() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('entryDate').value = `${yyyy}-${mm}-${dd}`;
            
            // Default select +30min
            selectQuickMinutes(30);
        }

        // Fixed Month Navigation Logic (Solves +1/-1 bug)
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            render();
        }

        function selectQuickMinutes(mins) {
            document.getElementById('selectedMinutes').value = mins;
            
            // Highlight selected button UI
            document.querySelectorAll('.quick-btn').forEach(btn => {
                const bMins = parseInt(btn.getAttribute('data-minutes'), 10);
                if (bMins === mins) {
                    btn.classList.add('ring-2', 'ring-slate-800', 'scale-[1.02]');
                } else {
                    btn.classList.remove('ring-2', 'ring-slate-800', 'scale-[1.02]');
                }
            });
        }

        function addRecord() {
            const dateVal = document.getElementById('entryDate').value;
            const minsVal = parseInt(document.getElementById('selectedMinutes').value, 10);
            const noteVal = document.getElementById('entryNote').value.trim();

            if (!dateVal) {
                showModalToast("日付を入力してください", false);
                return;
            }

            if (isNaN(minsVal) || minsVal === 0) {
                showModalToast("時間（30分単位）を選択してください", false);
                return;
            }

            const newRecord = {
                id: Date.now().toString(),
                date: dateVal,
                minutes: minsVal,
                note: noteVal
            };

            records.push(newRecord);
            saveRecords();

            // Clear note field
            document.getElementById('entryNote').value = '';

            // Update month if the added record date is in a different month
            const [rY, rM] = dateVal.split('-').map(Number);
            currentYear = rY;
            currentMonth = rM - 1;

            render();
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveRecords();
            render();
        }

        function formatMinutes(mins) {
            if (mins === 0) return "0分";
            const sign = mins > 0 ? "+" : "-";
            const abs = Math.abs(mins);
            const h = Math.floor(abs / 60);
            const m = abs % 60;

            if (h === 0) {
                return `${sign}${m}分`;
            } else if (m === 0) {
                return `${sign}${h}時間`;
            } else {
                return `${sign}${h}時間${m}分`;
            }
        }

        function render() {
            // Render Current Month Display
            document.getElementById('currentMonthDisplay').textContent = `${currentYear}年${currentMonth + 1}月`;

            // Filter Records for Current Month
            const targetPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            const monthRecords = records.filter(r => r.date.startsWith(targetPrefix));

            // Sort ascending by date
            monthRecords.sort((a, b) => a.date.localeCompare(b.date));

            // Calculate Monthly Total Difference
            const totalMinutes = monthRecords.reduce((sum, r) => sum + r.minutes, 0);

            // Update Dashboard UI
            const dashDisplay = document.getElementById('dashboardTotalDisplay');
            const dashSub = document.getElementById('dashboardStatusSub');

            if (totalMinutes > 0) {
                dashDisplay.className = "text-4xl sm:text-5xl font-black tracking-tight my-2 text-emerald-600";
                dashDisplay.innerHTML = `${formatMinutes(totalMinutes)}`;
                dashSub.textContent = "当月は超過分があります (プラス累計)";
            } else if (totalMinutes < 0) {
                dashDisplay.className = "text-4xl sm:text-5xl font-black tracking-tight my-2 text-rose-600";
                dashDisplay.innerHTML = `${formatMinutes(totalMinutes)}`;
                dashSub.textContent = "当月は不足分があります (マイナス累計)";
            } else {
                dashDisplay.className = "text-4xl sm:text-5xl font-black tracking-tight my-2 text-slate-800";
                dashDisplay.innerHTML = `0<span class="text-xl font-normal text-slate-500 ml-1">分</span>`;
                dashSub.textContent = "当月の超過・不足時間はありません";
            }

            // Render Records List (Screen View)
            const listEl = document.getElementById('recordsList');
            const printTableBody = document.getElementById('printTableBody');

            listEl.innerHTML = '';
            printTableBody.innerHTML = '';

            if (monthRecords.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-xs">
                        当月の記録はありません
                    </div>
                `;
                printTableBody.innerHTML = `
                    <tr>
                        <td colspan="3" style="text-align: center; color: #888;">当月の記録はありません</td>
                    </tr>
                `;
            } else {
                monthRecords.forEach(r => {
                    const isPos = r.minutes > 0;
                    const badgeClass = isPos 
                        ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                        : 'bg-rose-50 text-rose-700 border-rose-200';

                    // Screen List Item
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200/70 text-xs';
                    item.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="font-mono font-bold text-slate-700">${r.date}</span>
                            <span class="px-2.5 py-1 rounded-lg border font-bold ${badgeClass}">
                                ${formatMinutes(r.minutes)}
                            </span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-slate-500 max-w-[120px] sm:max-w-[180px] truncate">${r.note || '-'}</span>
                            <button type="button" onclick="deleteRecord('${r.id}')" class="p-1 text-slate-300 hover:text-rose-500 transition-colors" title="削除">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    `;
                    listEl.appendChild(item);

                    // Print Table Row
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${r.date}</td>
                        <td style="font-weight: bold; color: ${isPos ? '#15803d' : '#b91c1c'}">${formatMinutes(r.minutes)}</td>
                        <td>${r.note || '-'}</td>
                    `;
                    printTableBody.appendChild(tr);
                });
            }
        }

        function printReport() {
            saveUserInfo();

            const company = document.getElementById('companyInput').value || '未設定';
            const user = document.getElementById('userInput').value || '未設定';

            document.getElementById('printCompanyDisplay').textContent = company;
            document.getElementById('printUserDisplay').textContent = user;
            document.getElementById('printTargetMonthDisplay').textContent = `${currentYear}年${currentMonth + 1}月`;

            const targetPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            const monthRecords = records.filter(r => r.date.startsWith(targetPrefix));
            const totalMinutes = monthRecords.reduce((sum, r) => sum + r.minutes, 0);
            
            document.getElementById('printTotalDisplay').textContent = formatMinutes(totalMinutes);

            window.print();
        }

        function exportCSV() {
            saveUserInfo();

            const company = document.getElementById('companyInput').value || '';
            const user = document.getElementById('userInput').value || '';

            const targetPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            const monthRecords = records.filter(r => r.date.startsWith(targetPrefix));
            monthRecords.sort((a, b) => a.date.localeCompare(b.date));

            let csvContent = "\uFEFF"; // UTF-8 BOM
            csvContent += `会社名・所属,${company}\n`;
            csvContent += `氏名,${user}\n`;
            csvContent += `対象年月,${currentYear}年${currentMonth + 1}月\n\n`;
            csvContent += `日付,差分時間(分),表記,メモ\n`;

            monthRecords.forEach(r => {
                csvContent += `"${r.date}",${r.minutes},"${formatMinutes(r.minutes)}","${(r.note || '').replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `flextime_${currentYear}_${currentMonth + 1}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('settingsModal').classList.add('flex');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('flex');
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('modalToast').classList.add('hidden');
        }

        function showModalToast(msg, isSuccess = true) {
            const toast = document.getElementById('modalToast');
            toast.textContent = msg;
            toast.className = `p-2.5 rounded-xl text-xs font-bold text-center ${isSuccess ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        function generateBackupCode() {
            saveUserInfo();
            const dataObj = {
                records: records,
                company: localStorage.getItem('flextime_company') || '',
                user: localStorage.getItem('flextime_user_name') || ''
            };
            
            try {
                const jsonStr = JSON.stringify(dataObj);
                const code = btoa(encodeURIComponent(jsonStr));

                // Copy to clipboard
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(code).then(() => {
                        showModalToast("バックアップコードをクリップボードにコピーしました！");
                    }).catch(() => {
                        copyFallback(code);
                    });
                } else {
                    copyFallback(code);
                }
            } catch (e) {
                showModalToast("コードの生成に失敗しました", false);
            }
        }

        function copyFallback(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showModalToast("バックアップコードをコピーしました！");
            } catch (err) {
                showModalToast("手動でコピーしてください", false);
            }
            document.body.removeChild(textArea);
        }

        function restoreFromCode() {
            const code = document.getElementById('restoreCodeInput').value.trim();
            if (!code) {
                showModalToast("バックアップコードを入力してください", false);
                return;
            }

            try {
                const jsonStr = decodeURIComponent(atob(code));
                const dataObj = JSON.parse(jsonStr);

                if (dataObj && Array.isArray(dataObj.records)) {
                    records = dataObj.records;
                    saveRecords();

                    if (dataObj.company !== undefined) {
                        localStorage.setItem('flextime_company', dataObj.company);
                        document.getElementById('companyInput').value = dataObj.company;
                    }
                    if (dataObj.user !== undefined) {
                        localStorage.setItem('flextime_user_name', dataObj.user);
                        document.getElementById('userInput').value = dataObj.user;
                    }

                    render();
                    document.getElementById('restoreCodeInput').value = '';
                    showModalToast("データを正常に復元しました！");
                } else {
                    showModalToast("無効なバックアップコードです", false);
                }
            } catch (e) {
                showModalToast("コードの解析に失敗しました", false);
            }
        }
    </script>
</body>
</html>
